name: SmartNet secret history scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Scan current changes and inventory full Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan current changes with Gitleaks Action
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Install pinned Gitleaks CLI for historical inventory
        run: |
          VERSION=8.24.3
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Enforce full-history secret scan
        run: |
          gitleaks git --redact --log-opts="--all" --report-format=json --report-path=gitleaks-full-history.json .
      - name: Upload full-history report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartnet-gitleaks-full-history
          path: gitleaks-full-history.json
          if-no-files-found: ignore
          retention-days: 30
