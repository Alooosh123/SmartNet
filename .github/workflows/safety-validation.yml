name: SmartNet safety validation

on:
  push:
    branches:
      - main
      - automation/**
      - production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-n8n:
    name: Validate n8n workflow bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow JSON and graph
        run: python scripts/validate_n8n_workflows.py

  backend-safety-tests:
    name: Backend security and subscription tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
