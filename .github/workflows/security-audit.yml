name: SmartNet dependency and source security

on:
  push:
    branches:
      - main
      - hardening/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-and-code-audit:
    name: Dependency and high-severity code audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit bandit
      - name: Audit Python dependencies
        id: pip_audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc --format=json --output=pip-audit-report.json
      - name: Scan high-severity Python security findings
        id: bandit
        continue-on-error: true
        run: bandit -r backend -lll -x backend/tests -f json -o bandit-report.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartnet-security-reports
          path: |
            pip-audit-report.json
            bandit-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce security audit result
        if: always()
        env:
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
        run: |
          echo "pip-audit: $PIP_AUDIT_OUTCOME"
          echo "bandit: $BANDIT_OUTCOME"
          test "$PIP_AUDIT_OUTCOME" = "success"
          test "$BANDIT_OUTCOME" = "success"
