name: SmartNet CI

on:
  push:
    branches: [main, production-readiness, production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smartnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      PAYMENT_DEMO_MODE: "true"
      MIKROTIK_DEMO_MODE: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run automated tests
        run: pytest -q tests


  browser-e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci-browser.db
      PAYMENT_PROVIDER_MODE: manual
      PAYMENT_DEMO_MODE: "false"
      MIKROTIK_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end journey
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartnet-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Build frontend
        run: npm run build

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: smartnet_ci
          MARIADB_USER: smartnet_bootstrap
          MARIADB_PASSWORD: ci-bootstrap-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Create least-privilege database accounts
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
        run: |
          mariadb --host=127.0.0.1 --user=root --password="$MARIADB_ROOT_PASSWORD" <<'SQL'
          CREATE USER 'smartnet_app'@'%' IDENTIFIED BY 'ci-runtime-password';
          GRANT SELECT, INSERT, UPDATE, DELETE ON smartnet_ci.* TO 'smartnet_app'@'%';
          CREATE USER 'smartnet_migrator'@'%' IDENTIFIED BY 'ci-migration-password';
          GRANT ALL PRIVILEGES ON smartnet_ci.* TO 'smartnet_migrator'@'%';
          CREATE USER 'smartnet_backup'@'%' IDENTIFIED BY 'ci-backup-password';
          GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES ON smartnet_ci.* TO 'smartnet_backup'@'%';
          CREATE USER 'smartnet_restore'@'%' IDENTIFIED BY 'ci-restore-password';
          GRANT ALL PRIVILEGES ON smartnet_ci.* TO 'smartnet_restore'@'%';
          FLUSH PRIVILEGES;
          SQL
      - name: Apply Alembic migrations against MariaDB 11.8
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: mysql+asyncmy://smartnet_app:ci-runtime-password@127.0.0.1:3306/smartnet_ci?charset=utf8mb4
          MIGRATION_DATABASE_URL: mysql+asyncmy://smartnet_migrator:ci-migration-password@127.0.0.1:3306/smartnet_ci?charset=utf8mb4
        run: alembic upgrade head
      - name: Run backend lifecycle and authorization suite against MariaDB
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: mysql+asyncmy://smartnet_app:ci-runtime-password@127.0.0.1:3306/smartnet_ci?charset=utf8mb4
          NETWORK_OBSERVER_ENABLED: "false"
          PAYMENT_DEMO_MODE: "true"
          MIKROTIK_DEMO_MODE: "true"
          PYTHONPATH: .
        run: pytest -q tests
      - name: Test MariaDB backup and restore round-trip
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: "3306"
          MARIADB_DATABASE: smartnet_ci
          MARIADB_USER: smartnet_backup
          MARIADB_PASSWORD: ci-backup-password
          MARIADB_RESTORE_USER: smartnet_restore
          MARIADB_RESTORE_PASSWORD: ci-restore-password
        run: bash deploy/scripts/test-mariadb-backup-restore.sh
