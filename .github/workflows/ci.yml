name: SmartNet CI

on:
  push:
    branches: [main, production-readiness, production-hardening-mariadb-podman]
  pull_request:
    branches: [main, production-readiness]

permissions:
  contents: read

concurrency:
  group: smartnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      PAYMENT_PROVIDER_MODE: manual
      PAYMENT_DEMO_MODE: "true"
      MIKROTIK_DEMO_MODE: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Compile backend
        run: python -m compileall -q .
      - name: Backend and authorization tests
        run: pytest -q tests

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci-browser.db
      PAYMENT_PROVIDER_MODE: manual
      PAYMENT_DEMO_MODE: "false"
      MIKROTIK_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Full browser lifecycle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartnet-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Build frontend
        run: npm run build

  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: smartnet-ci-root-password
          MARIADB_DATABASE: smartnet
          MARIADB_USER: smartnet
          MARIADB_PASSWORD: smartnet-ci-application-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s
    env:
      ENVIRONMENT: development
      DATABASE_URL: mysql+asyncmy://smartnet:smartnet-ci-application-password@127.0.0.1:3306/smartnet?charset=utf8mb4
      TEST_DATABASE_URL: mysql+asyncmy://smartnet:smartnet-ci-application-password@127.0.0.1:3306/smartnet?charset=utf8mb4
      MARIADB_HOST: 127.0.0.1
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: smartnet
      MARIADB_USER: root
      MARIADB_PASSWORD: smartnet-ci-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply MariaDB migrations
        working-directory: backend
        run: alembic upgrade head
      - name: MariaDB driver and transaction smoke test
        working-directory: backend
        run: pytest -q tests/test_mariadb_smoke.py
      - name: Dump and restore smoke test
        run: bash scripts/test-mariadb-backup-restore.sh

  podman-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman and Compose provider
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          python -m pip install --user podman-compose
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build backend Containerfile
        run: podman build -f backend/Containerfile -t localhost/smartnet-backend:ci .
      - name: Build frontend Containerfile
        run: podman build -f frontend/Containerfile -t localhost/smartnet-frontend:ci frontend
      - name: Validate Podman Compose
        run: |
          cp .env.example .env
          podman-compose -f compose.yaml config
