name: SmartNet CI

on:
  push:
    branches: [main, production-readiness, production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smartnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      PAYMENT_DEMO_MODE: "true"
      MIKROTIK_DEMO_MODE: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run automated tests
        run: pytest -q tests


  browser-e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci-browser.db
      PAYMENT_PROVIDER_MODE: manual
      PAYMENT_DEMO_MODE: "false"
      MIKROTIK_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end journey
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartnet-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Build frontend
        run: npm run build
