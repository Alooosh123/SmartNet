name: SmartNet Android Wallet Collector

on:
  push:
    branches: [production-hardening]
    paths:
      - "android/wallet-collector/**"
      - ".github/workflows/android-wallet-collector.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/wallet-collector/**"
      - ".github/workflows/android-wallet-collector.yml"

permissions:
  contents: read

concurrency:
  group: smartnet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android API 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Assemble debug APK
        run: gradle --no-daemon -p android/wallet-collector :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smartnet-wallet-collector-debug
          path: android/wallet-collector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
