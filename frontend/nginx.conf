limit_req_zone $binary_remote_addr zone=smartnet_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=smartnet_registration:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }
    location = /auth/login {
        limit_req zone=smartnet_auth burst=5 nodelay;
        proxy_pass http://backend:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/register {
        limit_req zone=smartnet_registration burst=5 nodelay;
        proxy_pass http://backend:8000/auth/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/auth/registrations/[0-9]+/receipt$ {
        limit_req zone=smartnet_registration burst=3 nodelay;
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /agents/ {
        proxy_pass http://backend:8000/agents/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /mikrotik/ {
        proxy_pass http://backend:8000/mikrotik/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /cards/ {
        proxy_pass http://backend:8000/cards/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /client/ {
        proxy_pass http://backend:8000/client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { proxy_pass http://backend:8000/static/; }
    location /uploads/cards/ { proxy_pass http://backend:8000/uploads/cards/; }

    # /metrics is not proxied to the public browser surface.
}
